name: Generate Document PDF & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Si attiva quando crei un tag di consegna (es. v1.0)
    paths:
      - 'doc/**'
      - '.github/workflows/pdf.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'doc/**'
      - '.github/workflows/pdf.yml'

  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Generazione PDF via Pandoc
    - name: Build PDF via Pandoc
      uses: docker://pandoc/extra:latest
      with:
        entrypoint: /bin/sh
        args: -c "pandoc --output=relazione.pdf --pdf-engine=xelatex --toc --number-sections doc/*.md"

    # Salva il PDF negli Artifacts per controllarlo durante il lavoro/PR
    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: relazione-pdf
        path: relazione.pdf

    # Crea la Release ufficiale solo quando pubblichi un Tag (es. v1.0)
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: relazione.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
