name: Generate Document PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'doc/**'
      - '.github/workflows/pdf.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'doc/**'
      - '.github/workflows/pdf.yml'

  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: Corretto in v4
    - name: Checkout repository
      uses: actions/checkout@v4

    # STEP 2: Pandoc Docker Action
    - name: Build PDF via Pandoc
      uses: docker://pandoc/extra:latest
      with:
        args: >-
          --output=relazione.pdf
          --pdf-engine=xelatex
          --toc
          --number-sections
          doc/*.md

    # STEP 3: Upload Artifact
    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: relazione-pdf
        path: relazione.pdf
