name: Generate Document PDF & Release

on:
  # 1. Triggers per Push sui branch (richiede modifiche a doc/**)
  push:
    branches: [ main ]
    paths:
      - 'doc/**'
      - '.github/workflows/pdf.yml'

  # 2. Triggers per le Pull Request (richiede modifiche a doc/**)
  pull_request:
    branches: [ main ]
    paths:
      - 'doc/**'
      - '.github/workflows/pdf.yml'

  # 3. Triggers per i Tag di Release (ESECUZIONE SEMPRE GARANTITA, SENZA FILTRI PATHS)
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Generazione PDF via Pandoc
    - name: Build PDF via Pandoc
      uses: docker://pandoc/extra:latest
      with:
        entrypoint: /bin/sh
        args: -c "pandoc --output=relazione.pdf --pdf-engine=xelatex --toc --number-sections doc/*.md"

    # Salva il PDF negli Artifacts per controllarlo nelle PR / Push
    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: relazione-pdf
        path: relazione.pdf

    # Allegato automatico nella Release di GitHub se si tratta di un Tag
    - name: Attach PDF to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: relazione.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
